# Veröffentlicht eine neue Version: Ein Push auf einen Zweig "upload-v<Version>" enthält die in Teile zerlegten
# Installationsdateien (Liste in upload/dateien.txt) und die signierten Beschreibungen latest*.json.
# Die Aktion setzt die Dateien zusammen, prüft jede SHA-256-Prüfsumme gegen die Beschreibungen, erstellt das Release
# (oder ergänzt es) und löscht den Hilfszweig wieder.
name: Version veröffentlichen
on:
  push:
    branches: ["upload-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zusammensetzen und prüfen
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#upload-}"
          cd upload
          if [ -f dateien.txt ]; then LISTE=$(cat dateien.txt); else LISTE=$(cat datei.txt); fi
          for f in $LISTE; do cat "$f".teil.* > "$f" 2>/dev/null || cat teil.* > "$f"; done
          python3 - "$TAG" <<'PY'
          import json, glob, hashlib, os, sys
          tag = sys.argv[1]; n = 0
          for j in glob.glob("latest*.json"):
              m = json.load(open(j)); f = os.path.basename(m["url"])
              ist = hashlib.sha256(open(f, "rb").read()).hexdigest()
              assert ist == m["sha256"], f"Prüfsumme {f}: {ist} statt {m['sha256']}"
              assert "v" + m["version"] == tag, f"Version {m['version']} passt nicht zu {tag}"
              n += 1
          assert n, "keine Beschreibung gefunden"
          print(n, "Beschreibungen geprüft")
          PY
          ASSETS=(latest*.json)
          for f in $LISTE; do
            ASSETS+=("$f")
            case "$f" in
              GeruestOffice-Setup-*.exe) cp "$f" GeruestOffice-Setup.exe; ASSETS+=(GeruestOffice-Setup.exe);;
              GeruestOffice-Mac-arm64-*.zip) cp "$f" GeruestOffice-Mac-arm64.zip; ASSETS+=(GeruestOffice-Mac-arm64.zip);;
              GeruestOffice-Mac-x64-*.zip) cp "$f" GeruestOffice-Mac-x64.zip; ASSETS+=(GeruestOffice-Mac-x64.zip);;
            esac
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "GerüstOffice ${TAG#v}" --notes-file hinweise.md --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Hilfszweig löschen
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
